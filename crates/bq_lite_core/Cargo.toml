[package]
name = "bq-lite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure-Rust embedded GoogleSQL (BigQuery) engine core"

[features]
default = ["persistence"]
persistence = ["dep:redb"]
js-udf = ["dep:boa_engine"]

[dependencies]
arrow-array = "54"
arrow-buffer = "54"
arrow-ipc = "54"
arrow-schema = "54"
base64 = "0.22"
boa_engine = { version = "0.20", default-features = false, optional = true }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = "1"
digest = "0.11"
md-5 = "0.11"
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
parquet = { version = "54", default-features = false, features = ["arrow", "snap"] }
redb = { version = "2.6", optional = true }
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
