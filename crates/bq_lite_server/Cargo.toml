[package]
name = "bq-lite-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Standalone BigQuery REST v2 and gRPC Storage API emulator server"

[features]
default = []
js-udf = ["bq-lite-core/js-udf"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
bq-lite-core = { path = "../bq_lite_core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
parking_lot = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util"] }
tokio-stream = "0.1"
tonic = { version = "0.13", default-features = false, features = ["codegen", "prost", "router", "server"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["time"] }
tonic = { version = "0.13", default-features = false, features = ["channel"] }

[lints]
workspace = true
