[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
skip = [
    { name = "base64", version = "=0.22.1", reason = "arrow-cast 54 and reqwest/tonic 0.13 depend on 0.22 while hyper-util 0.1 uses 0.23" },
    { name = "bitflags", version = "=1.3.2", reason = "flatbuffers 24 (arrow-ipc 54) requires bitflags 1.3" },
    { name = "foldhash", version = "=0.1.5", reason = "hashbrown 0.15 uses foldhash 0.1 while hashbrown 0.16 (regress via boa_engine) uses 0.2" },
    { name = "getrandom", version = "=0.2.17", reason = "rand 0.8 (boa_engine) uses getrandom 0.2 while rand 0.10 / uuid use 0.4" },
    { name = "hashbrown", version = "=0.14.5", reason = "dashmap 6 (boa_engine) requires hashbrown 0.14" },
    { name = "hashbrown", version = "=0.15.5", reason = "arrow-array/parquet 54 pin hashbrown 0.15 while indexmap 2.14 uses 0.17" },
    { name = "hashbrown", version = "=0.16.1", reason = "regress 0.10 (boa_engine) uses hashbrown 0.16" },
    { name = "icu_collections", version = "=1.5.0", reason = "boa_engine 0.20 uses ICU4X 1.5 while idna_adapter 1.2 uses 2.4" },
    { name = "icu_normalizer", version = "=1.5.0", reason = "boa_engine 0.20 uses ICU4X 1.5 while idna_adapter 1.2 uses 2.4" },
    { name = "icu_normalizer_data", version = "=1.5.1", reason = "boa_engine 0.20 uses ICU4X 1.5 while idna_adapter 1.2 uses 2.4" },
    { name = "icu_properties", version = "=1.5.1", reason = "boa_engine 0.20 uses ICU4X 1.5 while idna_adapter 1.2 uses 2.4" },
    { name = "icu_properties_data", version = "=1.5.1", reason = "boa_engine 0.20 uses ICU4X 1.5 while idna_adapter 1.2 uses 2.4" },
    { name = "icu_provider", version = "=1.5.0", reason = "boa_engine 0.20 uses ICU4X 1.5 while idna_adapter 1.2 uses 2.4" },
    { name = "itertools", version = "=0.13.0", reason = "boa_engine 0.20 depends on itertools 0.13 while prost-derive 0.13 uses 0.14" },
    { name = "litemap", version = "=0.7.5", reason = "ICU4X 1.5 (boa_engine) uses litemap 0.7 while ICU4X 2.4 uses 0.8" },
    { name = "phf", version = "=0.11.3", reason = "boa_interner 0.20 uses phf 0.11 while chrono-tz 0.10 uses 0.12" },
    { name = "phf_shared", version = "=0.11.3", reason = "boa_interner 0.20 uses phf_shared 0.11 while chrono-tz 0.10 uses 0.12" },
    { name = "rand", version = "=0.8.8", reason = "boa_engine 0.20 uses rand 0.8 while bq_lite_core uses rand 0.10" },
    { name = "rand_core", version = "=0.6.4", reason = "rand 0.8 (boa_engine) uses rand_core 0.6 while rand 0.10 uses 0.10" },
    { name = "socket2", version = "=0.5.10", reason = "tonic 0.13 pins socket2 0.5 while tokio 1.54 uses 0.6" },
    { name = "syn", version = "=2.0.119", reason = "prost-derive, tracing-attributes, and zerocopy-derive still target syn 2" },
    { name = "synstructure", version = "=0.13.2", reason = "boa_macros/ICU4X 1.5 use synstructure 0.13 while ICU4X 2.4 uses 0.14" },
    { name = "tinystr", version = "=0.7.6", reason = "ICU4X 1.5 (boa_engine) uses tinystr 0.7 while ICU4X 2.4 uses 0.8" },
    { name = "windows-sys", version = "=0.52.0", reason = "pulled transitively via socket2 0.5 in tonic 0.13" },
    { name = "writeable", version = "=0.5.5", reason = "ICU4X 1.5 (boa_engine) uses writeable 0.5 while ICU4X 2.4 uses 0.6" },
    { name = "yoke", version = "=0.7.5", reason = "ICU4X 1.5 (boa_engine) uses yoke 0.7 while ICU4X 2.4 uses 0.8" },
    { name = "yoke-derive", version = "=0.7.5", reason = "ICU4X 1.5 (boa_engine) uses yoke-derive 0.7 while ICU4X 2.4 uses 0.8" },
    { name = "zerovec", version = "=0.10.4", reason = "ICU4X 1.5 (boa_engine) uses zerovec 0.10 while ICU4X 2.4 uses 0.11" },
    { name = "zerovec-derive", version = "=0.10.4", reason = "ICU4X 1.5 (boa_engine) uses zerovec-derive 0.10 while ICU4X 2.4 uses 0.11" },
]
deny = [
    { name = "sqlparser", reason = "Own the GoogleSQL parser and AST directly" },
    { name = "datafusion", reason = "Own the BigQuery execution semantics directly" },
    { name = "rusqlite", reason = "Do not back BigQuery with SQLite" },
    { name = "duckdb", reason = "Keep bq-lite pure Rust with zero C/C++ engine dependency" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
